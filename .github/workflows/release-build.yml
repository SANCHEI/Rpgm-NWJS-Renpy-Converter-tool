name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release executable
        shell: powershell
        run: .\build_release.ps1

      - name: Build experimental tools zip
        shell: powershell
        run: .\build_unity_text_lab.ps1

      - name: Resolve release file
        shell: powershell
        run: |
          $exe = Get-ChildItem -LiteralPath release -Filter 'GameAssetTool-v*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'No GameAssetTool release executable was produced.' }
          "RELEASE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_EXE_NAME=$($exe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Resolved release executable: $($exe.FullName)"
          $toolsZip = Get-ChildItem -LiteralPath release -Filter 'GameAssetTool-tools-experimental-v*.zip' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($toolsZip) {
            "TOOLS_ZIP=$($toolsZip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TOOLS_ZIP_NAME=$($toolsZip.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "Resolved experimental tools zip: $($toolsZip.FullName)"
          }

      - name: Calculate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash -LiteralPath $env:RELEASE_EXE -Algorithm SHA256).Hash
          "SHA-256: $hash" | Out-File -FilePath release\SHA256.txt -Encoding utf8
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_EXE_NAME }}
          path: ${{ env.RELEASE_EXE }}

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_EXE_NAME }}-sha256
          path: release/SHA256.txt

      - name: Upload experimental tools zip artifact
        if: env.TOOLS_ZIP != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOLS_ZIP_NAME }}
          path: ${{ env.TOOLS_ZIP }}

      - name: Attach assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @($env:RELEASE_EXE, 'release\SHA256.txt')
          if ($env:TOOLS_ZIP) { $assets += $env:TOOLS_ZIP }
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
