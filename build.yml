name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Application
      run: |
        ./build_winforms.bat
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RpgmvpConverterWinForms.exe
        path: bin/RpgmvpConverterWinForms.exe
